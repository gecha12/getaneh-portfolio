<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="portraitBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#142620" />
      <stop offset="60%" stop-color="#0a1411" />
      <stop offset="100%" stop-color="#070c0b" />
    </radialGradient>
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3FF12" />
      <stop offset="100%" stop-color="#087F50" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be8055" />
      <stop offset="100%" stop-color="#8b5531" />
    </linearGradient>
    <filter id="portraitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular background -->
  <rect width="500" height="500" fill="url(#portraitBg)" />
  
  <!-- Subtle ambient grid in portrait background -->
  <g opacity="0.12" stroke="#A3FF12" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="0" y1="100" x2="500" y2="100" />
    <line x1="0" y1="200" x2="500" y2="200" />
    <line x1="0" y1="300" x2="500" y2="300" />
    <line x1="0" y1="400" x2="500" y2="400" />
  </g>

  <!-- Developer Silhouette / Illustration -->
  <!-- Shoulders & Dark Tech Jacket -->
  <path d="M 110 490 C 110 390, 160 345, 250 345 C 340 345, 390 390, 390 490 Z" fill="#101c18" stroke="#087F50" stroke-width="2" />
  <path d="M 180 348 C 210 390, 290 390, 320 348 C 305 450, 195 450, 180 348 Z" fill="#080e0c" />
  <line x1="250" y1="390" x2="250" y2="490" stroke="rgba(163, 255, 18, 0.4)" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Neck -->
  <rect x="220" y="270" width="60" height="90" rx="10" fill="#9c633d" />

  <!-- Head -->
  <ellipse cx="250" cy="220" rx="75" ry="95" fill="url(#skinGrad)" />

  <!-- Hair / Grooming -->
  <path d="M 175 190 C 175 120, 220 105, 250 105 C 280 105, 325 120, 325 190 C 310 170, 290 160, 250 160 C 210 160, 190 170, 175 190 Z" fill="#120d0a" />

  <!-- Modern Smart Eyewear with Hot Green Reflection -->
  <rect x="185" y="200" width="55" height="36" rx="10" fill="rgba(163, 255, 18, 0.1)" stroke="#A3FF12" stroke-width="2.5" />
  <rect x="260" y="200" width="55" height="36" rx="10" fill="rgba(163, 255, 18, 0.1)" stroke="#A3FF12" stroke-width="2.5" />
  <line x1="240" y1="218" x2="260" y2="218" stroke="#A3FF12" stroke-width="2.5" />

  <!-- Focused Eyes behind glass -->
  <circle cx="212" cy="218" r="4.5" fill="#ffffff" />
  <circle cx="288" cy="218" r="4.5" fill="#ffffff" />

  <!-- Confident slight smile -->
  <path d="M 230 268 Q 250 282 270 268" fill="none" stroke="#542e16" stroke-width="3" stroke-linecap="round" />

  <!-- Over-Ear Studio / Dev Headphones -->
  <path d="M 160 220 C 160 120, 340 120, 340 220" fill="none" stroke="#A3FF12" stroke-width="6" stroke-linecap="round" filter="url(#portraitGlow)" />
  <rect x="150" y="195" width="20" height="50" rx="9" fill="#087F50" stroke="#A3FF12" stroke-width="1.5" />
  <rect x="330" y="195" width="20" height="50" rx="9" fill="#087F50" stroke="#A3FF12" stroke-width="1.5" />

  <!-- Tech ambient overlay badge -->
  <rect x="175" y="445" width="150" height="30" rx="15" fill="#090E0D" stroke="#A3FF12" stroke-width="1.5" />
  <text x="250" y="465" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" fill="#A3FF12" text-anchor="middle">&lt;GD: DEV /&gt;</text>
</svg>

