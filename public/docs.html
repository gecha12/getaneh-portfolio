<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Getaneh Dejenie — Engineering Documentation Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Marked.js for fast client-side markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #08110c;
      color: #E8F5EE;
      min-height: 100vh;
      display: flex;
    }

    /* Left Sidebar Navigation */
    .docs-sidebar {
      width: 320px;
      background: #0d1a12;
      border-right: 1px solid rgba(85, 214, 138, 0.18);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      overflow-y: auto;
      z-index: 10;
    }

    .docs-brand {
      padding: 1.4rem 1.6rem;
      border-bottom: 1px solid rgba(85, 214, 138, 0.18);
      background: #08110c;
    }

    .docs-brand h2 {
      font-size: 1.1rem;
      color: #ffffff;
      font-weight: 800;
    }

    .docs-brand span {
      font-size: 0.76rem;
      color: #55D68A;
      font-family: 'Fira Code', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .docs-nav {
      list-style: none;
      padding: 1rem 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .docs-link {
      display: block;
      padding: 0.65rem 0.9rem;
      border-radius: 6px;
      color: #9BB8A4;
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 500;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .docs-link:hover {
      background: rgba(85, 214, 138, 0.08);
      color: #ffffff;
      border-color: rgba(85, 214, 138, 0.2);
    }

    .docs-link.active {
      background: #1A3326;
      color: #A8FF3E;
      font-weight: 700;
      border-color: #55D68A;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }

    .back-home {
      margin-top: auto;
      padding: 1.2rem;
      border-top: 1px solid rgba(85, 214, 138, 0.15);
      background: #08110c;
    }

    .back-home a {
      color: #55D68A;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Main Reading Stage */
    .docs-stage {
      margin-left: 320px;
      flex: 1;
      padding: 3rem 4rem;
      max-width: 1040px;
    }

    /* Document Sheet */
    .doc-sheet {
      background: #0f2217;
      border: 1px solid rgba(85, 214, 138, 0.22);
      border-radius: 12px;
      padding: 3.5rem 4rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      line-height: 1.75;
      font-size: 1.02rem;
    }

    /* VISUAL IDENTITY: Bright Red Keywords + Vivid Vibrant Emerald Green Notes */
    .doc-sheet h1 {
      font-size: 2.2rem;
      color: #ffffff;
      border-bottom: 2px solid #55D68A;
      padding-bottom: 0.8rem;
      margin-bottom: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .doc-sheet h2 {
      font-size: 1.45rem;
      color: #A8FF3E;
      margin: 2.4rem 0 1rem 0;
      border-bottom: 1px solid rgba(85, 214, 138, 0.2);
      padding-bottom: 0.4rem;
      font-weight: 800;
    }

    .doc-sheet h3 {
      font-size: 1.2rem;
      color: #C9F7D5;
      margin: 1.6rem 0 0.8rem 0;
      font-weight: 700;
    }

    /* ALL NOTES: Vibrant Rich Emerald Green */
    .doc-sheet p,
    .doc-sheet li,
    .doc-sheet span {
      color: #72E39F !important; /* High-contrast vivid green */
    }

    /* FIRST KEYWORDS / LABELS: Vibrant Glowing Red */
    .doc-sheet strong,
    .doc-sheet b {
      color: #FF3B56 !important; /* Crisp, electric red */
      font-weight: 800 !important;
      text-shadow: 0 0 10px rgba(255, 59, 86, 0.35);
    }

    .doc-sheet ul, .doc-sheet ol {
      padding-left: 1.8rem;
      margin-bottom: 1.4rem;
    }

    .doc-sheet li {
      margin-bottom: 0.6rem;
    }

    .doc-sheet hr {
      border: none;
      border-top: 1px solid rgba(85, 214, 138, 0.2);
      margin: 2.5rem 0;
    }

    .doc-sheet code {
      font-family: 'Fira Code', monospace;
      font-size: 0.88rem;
      background: #08120c;
      color: #A8FF3E;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid rgba(85, 214, 138, 0.2);
    }

    .doc-sheet pre {
      background: #07100b;
      border: 1px solid rgba(85, 214, 138, 0.25);
      border-radius: 8px;
      padding: 1.2rem;
      overflow-x: auto;
      margin: 1.4rem 0;
    }

    .doc-sheet pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: #C9F7D5;
      font-size: 0.86rem;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      .docs-sidebar {
        width: 100%;
        position: relative;
        height: auto;
      }
      body { flex-direction: column; }
      .docs-stage {
        margin-left: 0;
        padding: 1.5rem;
      }
      .doc-sheet { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar Navigation -->
  <aside class="docs-sidebar">
    <div class="docs-brand">
      <h2>Getaneh Dejenie</h2>
      <span>Documentation Suite (13 Files)</span>
    </div>

    <ul class="docs-nav" id="navList">
      <!-- Injected by JavaScript -->
    </ul>

    <div class="back-home">
      <a href="/">&larr; Return to Portfolio</a>
    </div>
  </aside>

  <!-- Main Reading Canvas -->
  <main class="docs-stage">
    <article class="doc-sheet" id="docContent">
      <div style="text-align: center; color: #55D68A; padding: 3rem 0;">
        Loading engineering document...
      </div>
    </article>
  </main>

  <script>
    const docs = [
      { id: '01', title: '01. Project Overview', file: '/docs/01-project-overview.md' },
      { id: '02', title: '02. Technology Stack', file: '/docs/02-technology-stack.md' },
      { id: '03', title: '03. Frontend Architecture', file: '/docs/03-frontend-architecture.md' },
      { id: '04', title: '04. Backend Architecture', file: '/docs/04-backend-architecture.md' },
      { id: '05', title: '05. Database Design', file: '/docs/05-database-design.md' },
      { id: '06', title: '06. System Architecture', file: '/docs/06-system-architecture.md' },
      { id: '07', title: '07. API Documentation', file: '/docs/07-api-documentation.md' },
      { id: '08', title: '08. Security Audit Report', file: '/docs/08-security-audit.md' },
      { id: '09', title: '09. UI/UX Design System', file: '/docs/09-ui-ux-design.md' },
      { id: '10', title: '10. Testing Report', file: '/docs/10-testing-report.md' },
      { id: '11', title: '11. Deployment Guide', file: '/docs/11-deployment-guide.md' },
      { id: '12', title: '12. Future Improvements', file: '/docs/12-future-improvements.md' },
      { id: '13', title: '13. Interview Preparation', file: '/docs/13-interview-preparation.md' }
    ];

    let currentFile = docs[0].file;

    function renderNav() {
      const navList = document.getElementById('navList');
      navList.innerHTML = docs.map(doc => `
        <li>
          <a href="#${doc.id}"
             class="docs-link ${doc.file === currentFile ? 'active' : ''}"
             onclick="loadDoc('${doc.file}')">
            ${doc.title}
          </a>
        </li>
      `).join('');
    }

    async function loadDoc(file) {
      currentFile = file;
      renderNav();
      const contentEl = document.getElementById('docContent');
      contentEl.innerHTML = '<div style="text-align: center; color: #55D68A; padding: 2rem;">Loading document...</div>';

      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error('File not found: ' + file);
        const mdText = await res.text();
        contentEl.innerHTML = marked.parse(mdText);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        contentEl.innerHTML = `<div style="color: #FF3B56;">Error loading document: ${err.message}</div>`;
      }
    }

    // Hash routing
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.replace('#', '');
      const matched = docs.find(d => d.id === hash);
      if (matched) {
        loadDoc(matched.file);
      } else {
        loadDoc(docs[0].file);
      }
    });
  </script>
</body>
</html>
