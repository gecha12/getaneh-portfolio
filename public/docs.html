<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Getaneh Dejenie — Engineering Documentation Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <!-- Marked.js parser with fallback -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Direct Offline Document Data (Solves "Failed to Fetch" when opened directly via file://) -->
  <script src="docs-data.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111A16;
      color: #E2ECE5;
      min-height: 100vh;
      display: flex;
    }

    /* Left Sidebar Navigation */
    .docs-sidebar {
      width: 310px;
      background: #0D1612;
      border-right: 1px solid rgba(85, 214, 138, 0.14);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      overflow-y: auto;
      z-index: 10;
    }

    .docs-brand {
      padding: 1.3rem 1.5rem;
      border-bottom: 1px solid rgba(85, 214, 138, 0.12);
      background: #09100C;
    }

    .docs-brand h2 {
      font-size: 1.05rem;
      color: #F4F8F4;
      font-weight: 700;
    }

    .docs-brand span {
      font-size: 0.75rem;
      color: #55D68A;
      font-family: 'Fira Code', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .docs-nav {
      list-style: none;
      padding: 1rem 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .docs-link {
      display: block;
      padding: 0.6rem 0.85rem;
      border-radius: 6px;
      color: #8CA394;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .docs-link:hover {
      background: rgba(85, 214, 138, 0.07);
      color: #E2ECE5;
      border-color: rgba(85, 214, 138, 0.18);
    }

    .docs-link.active {
      background: #1B2E24;
      color: #A8FF3E;
      font-weight: 600;
      border-color: rgba(85, 214, 138, 0.4);
    }

    .back-home {
      margin-top: auto;
      padding: 1.1rem;
      border-top: 1px solid rgba(85, 214, 138, 0.12);
      background: #09100C;
    }

    .back-home a {
      color: #55D68A;
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Main Reading Stage */
    .docs-stage {
      margin-left: 310px;
      flex: 1;
      padding: 2.8rem 3.5rem;
      max-width: 1000px;
    }

    /* Document Sheet */
    .doc-sheet {
      background: #15221C;
      border: 1px solid rgba(85, 214, 138, 0.15);
      border-radius: 10px;
      padding: 3rem 3.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      line-height: 1.75;
      font-size: 0.98rem;
    }

    .doc-sheet h1 {
      font-size: 2rem;
      color: #FFFFFF;
      border-bottom: 2px solid rgba(85, 214, 138, 0.35);
      padding-bottom: 0.7rem;
      margin-bottom: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .doc-sheet h2 {
      font-size: 1.35rem;
      color: #D2E8DA;
      margin: 2.2rem 0 0.9rem 0;
      border-bottom: 1px solid rgba(85, 214, 138, 0.16);
      padding-bottom: 0.35rem;
      font-weight: 700;
    }

    .doc-sheet h3 {
      font-size: 1.12rem;
      color: #B4D5C0;
      margin: 1.5rem 0 0.7rem 0;
      font-weight: 600;
    }

    .doc-sheet p,
    .doc-sheet li,
    .doc-sheet span {
      color: #B2CEBD !important;
    }

    .doc-sheet strong,
    .doc-sheet b {
      color: #E26D5C !important;
      font-weight: 600 !important;
    }

    .doc-sheet ul, .doc-sheet ol {
      padding-left: 1.6rem;
      margin-bottom: 1.3rem;
    }

    .doc-sheet li {
      margin-bottom: 0.55rem;
    }

    .doc-sheet hr {
      border: none;
      border-top: 1px solid rgba(85, 214, 138, 0.15);
      margin: 2.2rem 0;
    }

    .doc-sheet code {
      font-family: 'Fira Code', monospace;
      font-size: 0.86rem;
      background: #0E1813;
      color: #9FDDB7;
      padding: 0.18rem 0.45rem;
      border-radius: 4px;
      border: 1px solid rgba(85, 214, 138, 0.15);
    }

    .doc-sheet pre {
      background: #0C1510;
      border: 1px solid rgba(85, 214, 138, 0.18);
      border-radius: 6px;
      padding: 1.1rem;
      overflow-x: auto;
      margin: 1.3rem 0;
    }

    .doc-sheet pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: #C8E0D2;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      .docs-sidebar {
        width: 100%;
        position: relative;
        height: auto;
      }
      body { flex-direction: column; }
      .docs-stage {
        margin-left: 0;
        padding: 1.4rem;
      }
      .doc-sheet { padding: 1.8rem 1.4rem; }
    }
  </style>
</head>
<body>

  <!-- Left Sidebar Navigation -->
  <aside class="docs-sidebar">
    <div class="docs-brand">
      <h2>Getaneh Dejenie</h2>
      <span>Documentation Suite (13 Files)</span>
    </div>

    <ul class="docs-nav" id="navList">
      <!-- Injected by JavaScript -->
    </ul>

    <div class="back-home">
      <a href="/">&larr; Return to Portfolio</a>
    </div>
  </aside>

  <!-- Main Reading Canvas -->
  <main class="docs-stage">
    <article class="doc-sheet" id="docContent">
      <div style="text-align: center; color: #55D68A; padding: 3rem 0;">
        Loading engineering document...
      </div>
    </article>
  </main>

  <script>
    const docs = [
      { id: '01', title: '01. Project Overview', filename: '01-project-overview.md' },
      { id: '02', title: '02. Technology Stack', filename: '02-technology-stack.md' },
      { id: '03', title: '03. Frontend Architecture', filename: '03-frontend-architecture.md' },
      { id: '04', title: '04. Backend Architecture', filename: '04-backend-architecture.md' },
      { id: '05', title: '05. Database Design', filename: '05-database-design.md' },
      { id: '06', title: '06. System Architecture', filename: '06-system-architecture.md' },
      { id: '07', title: '07. API Documentation', filename: '07-api-documentation.md' },
      { id: '08', title: '08. Security Audit Report', filename: '08-security-audit.md' },
      { id: '09', title: '09. UI/UX Design System', filename: '09-ui-ux-design.md' },
      { id: '10', title: '10. Testing Report', filename: '10-testing-report.md' },
      { id: '11', title: '11. Deployment Guide', filename: '11-deployment-guide.md' },
      { id: '12', title: '12. Future Improvements', filename: '12-future-improvements.md' },
      { id: '13', title: '13. Interview Preparation', filename: '13-interview-preparation.md' }
    ];

    let currentFilename = docs[0].filename;

    function renderNav() {
      const navList = document.getElementById('navList');
      navList.innerHTML = docs.map(doc => `
        <li>
          <a class="docs-link ${doc.filename === currentFilename ? 'active' : ''}"
             onclick="loadDoc('${doc.filename}')">
            ${doc.title}
          </a>
        </li>
      `).join('');
    }

    async function loadDoc(filename) {
      currentFilename = filename;
      renderNav();
      const contentEl = document.getElementById('docContent');

      // 1. Direct Memory/Bundle Strategy (Guarantees instant load under file://, localhost, or CDN with NO fetch errors)
      if (window.DOCS_CONTENT && window.DOCS_CONTENT[filename]) {
        renderMarkdown(window.DOCS_CONTENT[filename]);
        return;
      }

      // 2. Fallback Fetch Strategy (if hosted via HTTP server)
      try {
        const res = await fetch('docs/' + filename);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const mdText = await res.text();
        renderMarkdown(mdText);
      } catch (err) {
        contentEl.innerHTML = `
          <div style="color: #E26D5C; padding: 2rem 0;">
            <h3 style="color: #E26D5C; margin-bottom: 0.8rem;">Document Notice</h3>
            <p style="color: #B2CEBD;">Could not load via network (${err.message}).</p>
          </div>
        `;
      }
    }

    function renderMarkdown(mdText) {
      const contentEl = document.getElementById('docContent');
      if (window.marked && typeof window.marked.parse === 'function') {
        contentEl.innerHTML = window.marked.parse(mdText);
      } else {
        // Fallback preformatted text if CDN blocked
        contentEl.innerHTML = '<pre style="white-space: pre-wrap; font-family: inherit;">' + escapeHtml(mdText) + '</pre>';
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderNav();
      loadDoc(docs[0].filename);
    });
  </script>
</body>
</html>
